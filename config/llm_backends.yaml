# LLM backend profiles (ADR-005). Selected by `run_agent.sh --backend <name>`;
# `default` names the profile used when --backend is omitted.
#
# Fields per profile:
#   provider     openai_compatible | anthropic   (protocol the endpoint speaks)
#   base_url     endpoint root exported as OPENAI_BASE_URL / ANTHROPIC_BASE_URL
#   model        exported as MODEL_NAME / ANTHROPIC_MODEL
#   api_key      literal key/token; local servers usually accept any placeholder
#   api_key_env  (optional) env var read at run time; overrides api_key when set
#   context_length     (optional, default 32768) exported as LLM_CONTEXT_LENGTH; MUST match the model's num_ctx —
#                      Open Code treats a model without a declared limit as 0 tokens and compacts after every turn
#   max_output_tokens  (optional, default 8192) exported as LLM_MAX_OUTPUT_TOKENS
#   extra_env    (optional) additional KEY: value pairs exported verbatim
default: ollama

backends:
  ollama:
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    model: gpt-oss:20b-32k     # `ollama create gpt-oss:20b-32k -f Modelfile` with PARAMETER num_ctx 32768 (Ollama default 4096 truncates the agent context)
    # NOT usable: qwen2.5-coder:14b(-32k) — emits tool calls as bare JSON text without <tool_call> tags, Ollama never returns tool_calls
    api_key: ollama            # Ollama ignores the key but clients require one
    context_length: 32768      # = num_ctx of the *-32k variants
    max_output_tokens: 8192
    api_key_env: OLLAMA_API_KEY
    extra_env:
      OLLAMA_HOST: http://localhost:11434

  freetoken:
    provider: openai_compatible
    base_url: http://localhost:8080/v1
    model: qwen3-coder
    api_key: ""
    api_key_env: FREETOKEN_API_KEY
